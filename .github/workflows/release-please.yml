name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please stamps VERSION in js/delivery/version.ts (extra-files generic)
  # inside the release PR, but it cannot rebuild the derived artifacts — the
  # shipped JS outputs built from that source and the committed .skill bundles
  # that carry them — and a derived file that lags its source is exactly what
  # make check-js / check-bundles guard against. So the release branch gets
  # everything rebuilt here, right after release-please (re)writes it; a later
  # regeneration of the branch re-runs this job through the same main push.
  bundle-sync:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: make deps
      # The committed outputs are written only here, as the release build (the
      # release channel stamped in): every install channel takes main, and only
      # such a bridge refreshes a machine's home copy; a working copy builds dev
      # into dist/dev.
      - name: Rebuild the shipped JS and the bundles for the stamped version
        run: make build-release
      - name: Check the shipped JS against the stamped version
        run: make check-js
      - name: Commit them back to the release branch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: rebuild the shipped JS and bundles for the stamped version"
          git push

  # The OpenCode plugin as an npm archive (scripts/pack-opencode.mjs), packed from the
  # tag's committed release outputs and attached to its GitHub release under a versioned
  # address: releases/download/vX.Y.Z/verstak-opencode-X.Y.Z.tgz — never /latest/, which
  # a plugin loader caches by URL.
  opencode-asset:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Pack the OpenCode archive
        run: make pack-opencode
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" "dist/pack/verstak-opencode-${TAG#v}.tgz" --clobber

  # The same bytes to npm by trusted publishing (OIDC, no token). The trusted publisher is
  # configured on npmjs.com for this file, so the publish stays here, not in a called
  # workflow; it can be added only once the package exists, so the first version is
  # published by hand and the repository variable NPM_TRUSTED_PUBLISH=1 turns this on.
  opencode-npm:
    needs: [release-please, opencode-asset]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Skipped without trusted publishing
        if: ${{ vars.NPM_TRUSTED_PUBLISH != '1' }}
        run: echo "::notice::npm publish skipped — the repository variable NPM_TRUSTED_PUBLISH is not 1"
      - uses: actions/checkout@v4
        if: ${{ vars.NPM_TRUSTED_PUBLISH == '1' }}
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        if: ${{ vars.NPM_TRUSTED_PUBLISH == '1' }}
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer and Node 22.14 or newer.
      - name: Update npm
        if: ${{ vars.NPM_TRUSTED_PUBLISH == '1' }}
        run: npm install -g npm@^11.5.1
      - name: Take the release's archive
        if: ${{ vars.NPM_TRUSTED_PUBLISH == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release download "$TAG" --pattern "verstak-opencode-${TAG#v}.tgz" --dir dist/pack
      - name: Publish it
        if: ${{ vars.NPM_TRUSTED_PUBLISH == '1' }}
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: npm publish "dist/pack/verstak-opencode-${TAG#v}.tgz" --access public
